name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          # Create dist directory
          mkdir -p dist
          
          # Build for Linux amd64
          GOOS=linux GOARCH=amd64 go build -o dist/rog-linux-amd64 -ldflags="-s -w" .
          
          # Build for Linux arm64
          GOOS=linux GOARCH=arm64 go build -o dist/rog-linux-arm64 -ldflags="-s -w" .
          
          # Build for macOS amd64
          GOOS=darwin GOARCH=amd64 go build -o dist/rog-darwin-amd64 -ldflags="-s -w" .
          
          # Build for macOS arm64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -o dist/rog-darwin-arm64 -ldflags="-s -w" .
          
          # Build for Windows amd64
          GOOS=windows GOARCH=amd64 go build -o dist/rog-windows-amd64.exe -ldflags="-s -w" .
          
          # Create compressed archives
          cd dist
          
          # Linux amd64
          tar -czf rog-${{ steps.get_version.outputs.VERSION }}-linux-amd64.tar.gz rog-linux-amd64
          
          # Linux arm64
          tar -czf rog-${{ steps.get_version.outputs.VERSION }}-linux-arm64.tar.gz rog-linux-arm64
          
          # macOS amd64
          tar -czf rog-${{ steps.get_version.outputs.VERSION }}-darwin-amd64.tar.gz rog-darwin-amd64
          
          # macOS arm64
          tar -czf rog-${{ steps.get_version.outputs.VERSION }}-darwin-arm64.tar.gz rog-darwin-arm64
          
          # Windows amd64
          zip rog-${{ steps.get_version.outputs.VERSION }}-windows-amd64.zip rog-windows-amd64.exe
          
          cd ..

      - name: Generate checksums
        run: |
          cd dist
          sha256sum rog-${{ steps.get_version.outputs.VERSION }}-*.tar.gz rog-${{ steps.get_version.outputs.VERSION }}-*.zip > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rog-${{ steps.get_version.outputs.VERSION }}-linux-amd64.tar.gz
            dist/rog-${{ steps.get_version.outputs.VERSION }}-linux-arm64.tar.gz
            dist/rog-${{ steps.get_version.outputs.VERSION }}-darwin-amd64.tar.gz
            dist/rog-${{ steps.get_version.outputs.VERSION }}-darwin-arm64.tar.gz
            dist/rog-${{ steps.get_version.outputs.VERSION }}-windows-amd64.zip
            dist/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
