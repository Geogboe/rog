version: 2

project_name: rog

before:
  hooks:
    - go mod tidy
    - bash scripts/build-wsl-worker.sh
    - python3 scripts/build-third-party-notices.py

builds:
  - id: rog
    main: .
    binary: rog
    ldflags:
      - "-s -w -X github.com/Geogboe/rog/cmd.version={{ .Version }}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: rog-archives
    ids:
      - rog
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.txt
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  prerelease: auto
